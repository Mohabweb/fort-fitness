<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>%TITLE%</title>
  <meta name="description" content="%DESC%" />
  <meta name="theme-color" content="#071039" />
  <meta name="color-scheme" content="dark" />

  <link rel="canonical" href="%SITE_URL%/" />
  <link rel="alternate" hreflang="en" href="%SITE_URL%/" />
  <link rel="alternate" hreflang="ar" href="%SITE_URL%/?lang=ar" />
  <link rel="alternate" hreflang="x-default" href="%SITE_URL%/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Fort Fitness" />
  <meta property="og:title" content="%TITLE%" />
  <meta property="og:description" content="%DESC%" />
  <meta property="og:url" content="%SITE_URL%/" />
  <meta property="og:image" content="%SITE_URL%/images/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="ar_QA" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="%TITLE%" />
  <meta name="twitter:description" content="%DESC%" />
  <meta name="twitter:image" content="%SITE_URL%/images/og.jpg" />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-tight-latin-wght-normal.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-serif-latin-400-italic.woff2" crossorigin />
  <link rel="preload" as="image" href="/images/hero-reception-800.webp"
        imagesrcset="/images/hero-reception-480.webp 480w, /images/hero-reception-800.webp 800w, /images/hero-reception-1200.webp 1200w"
        imagesizes="(min-width: 960px) 520px, 80vw" fetchpriority="high" />

  <!-- Set language/direction before first paint (no flash when Arabic was chosen) -->
  <script>
    try {
      var q = new URLSearchParams(location.search).get('lang') || localStorage.getItem('ff-lang');
      if (q === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
    } catch (e) {}
    // Entrance animations start from hidden. Skipped for reduced motion; undone if the app script never boots.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('anim');
      setTimeout(function () { if (!window.__ffReady) document.documentElement.classList.remove('anim'); }, 4000);
    }
  </script>

  <!--JSONLD-->
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip"></a>

  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></symbol>
    <symbol id="i-machine" viewBox="0 0 24 24"><path d="M4 21h16M8 21V8h8v13M8 12h8M8 16h8M12 8V3M9 3h6"/></symbol>
    <symbol id="i-cable" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v10M9 17h6M9 17v3M15 17v3"/></symbol>
    <symbol id="i-cardio" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></symbol>
    <symbol id="i-mirror" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 9l3-3M9 14l6-6"/></symbol>
    <symbol id="i-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></symbol>
  </svg>

  <!-- Fixed floating glass nav (outside <main>) -->
  <header class="nav" id="nav">
    <a class="wordmark" href="#home" aria-label="Fort Fitness"><span class="w-fort">FORT</span><span class="w-fitness">FITNESS</span></a>
    <nav class="nav-links" data-i18n-aria="nav.primary">
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#plans" data-i18n="nav.plans"></a>
      <a href="#locations" data-i18n="nav.locations"></a>
    </nav>
    <div class="nav-actions">
      <button type="button" class="lang-btn" data-lang-toggle data-i18n-aria="nav.langAria"><span data-i18n="nav.lang"></span></button>
      <a class="btn btn--primary btn--sm nav-join" href="#plans"><span data-i18n="nav.join"></span></a>
      <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu" data-i18n-aria="nav.openMenu">
        <svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
    </div>
  </header>

  <!-- Mobile full-screen menu -->
  <div class="menu" id="menu" inert>
    <div class="menu-glow" aria-hidden="true"></div>
    <nav class="menu-links" data-i18n-aria="nav.menu">
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#plans" data-i18n="nav.plans"></a>
      <a href="#locations" data-i18n="nav.locations"></a>
    </nav>
    <div class="menu-foot">
      <div class="menu-calls" data-render="menucalls"></div>
      <a class="btn btn--primary btn--lg" href="#plans"><span data-i18n="nav.join"></span></a>
    </div>
  </div>

  <main id="main">

    <!-- 1. HERO — tagged: pixels hand off to About -->
    <section id="home" class="sec sec--950 hero" data-st-03="20" data-st-mobile-resolution="10" data-st-start="bottom bottom">
      <div class="bg" aria-hidden="true">
        <span class="glow" style="--x:82%;--y:58%;--s:95vmax;--c:rgba(26,59,176,.7)"></span>
        <span class="glow" style="--x:8%;--y:104%;--s:70vmax;--c:rgba(46,93,230,.38)"></span>
        <span class="glow" style="--x:60%;--y:112%;--s:50vmax;--c:rgba(110,146,242,.22)"></span>
        <div class="guides"><i></i><i></i><i></i></div>
        <svg class="terrain" viewBox="0 0 1440 220" preserveAspectRatio="none" focusable="false"><path d="M0 220V150l120-40 100 25 120-65 90 50 130-25 140 55 120-45 140 35 140-55 120 45 110-30 110 40v80z"/></svg>
      </div>

      <div class="inner hero-grid">
        <div class="hero-copy">
          <div class="pill-row" data-hero>
            <span class="pill pill--dot" data-i18n="hero.label"></span>
            <span class="pill" data-i18n="hero.label2"></span>
          </div>
          <h1 class="h1" data-i18n="hero.h1"></h1>
          <p class="lead" data-hero data-i18n="hero.lead"></p>
          <div class="cta-row" data-hero>
            <a class="btn btn--primary btn--lg" href="#plans"><span data-i18n="hero.cta1"></span><svg class="ic ic-arrow" aria-hidden="true"><use href="#i-arrow"/></svg></a>
            <a class="btn btn--glass btn--lg" href="#locations"><svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg><span data-i18n="hero.cta2"></span></a>
          </div>
        </div>

        <div class="hero-scene" data-hero>
          <svg class="ring" viewBox="0 0 600 600" aria-hidden="true" focusable="false">
            <circle class="ring-track" cx="300" cy="300" r="270"/>
            <circle class="ring-seg" cx="300" cy="300" r="270" pathLength="100"/>
            <circle class="node node--light" cx="570" cy="300" r="13"/>
            <circle class="node node--blue" cx="435" cy="66" r="13"/>
            <circle class="node node--dark" cx="46" cy="208" r="12"/>
            <circle class="node node--light" cx="300" cy="570" r="9"/>
          </svg>
          <div class="card3d">
            <img src="/images/hero-reception-800.webp"
                 srcset="/images/hero-reception-480.webp 480w, /images/hero-reception-800.webp 800w, /images/hero-reception-1200.webp 1200w, /images/hero-reception-1600.webp 1600w"
                 sizes="(min-width: 960px) 520px, 80vw" width="1600" height="2000" fetchpriority="high" decoding="async"
                 data-i18n-alt="alt.hero" />
            <span class="card-shade" aria-hidden="true"></span>
          </div>
          <div class="chip chip--a" data-float>
            <span class="pill pill--dot pill--solid" data-i18n="hero.chip1"></span>
          </div>
          <div class="chip chip--b glass" data-float>
            <span class="chip-label" data-i18n="hero.chip2"></span>
            <span class="chip-value" data-render="chipfrom"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. ABOUT -->
    <section id="about" class="sec sec--900">
      <div class="bg" aria-hidden="true">
        <span class="glow" style="--x:100%;--y:55%;--s:70vmax;--c:rgba(26,59,176,.55)"></span>
        <span class="glow" style="--x:0%;--y:95%;--s:55vmax;--c:rgba(46,93,230,.22)"></span>
        <div class="guides"><i></i><i></i><i></i></div>
      </div>
      <div class="inner">
        <div class="sec-head">
          <div>
            <span class="pill pill--dot" data-reveal data-i18n="about.label"></span>
            <h2 class="h2" data-reveal data-i18n="about.h2"></h2>
          </div>
          <p class="sec-p" data-reveal data-i18n="about.p"></p>
        </div>

        <ul class="bento" role="list">
          <li class="tile tile--a" data-reveal>
            <img src="/images/floor-wide-563.webp" srcset="/images/floor-wide-480.webp 480w, /images/floor-wide-563.webp 563w"
                 sizes="(min-width: 960px) 46vw, 92vw" width="563" height="422" loading="lazy" decoding="async" data-i18n-alt="alt.floor" />
            <span class="pill tile-tag" data-i18n="about.tag.machines"></span>
          </li>
          <li class="tile tile--b" data-reveal>
            <img src="/images/dumbbells-mirror-634.webp" srcset="/images/dumbbells-mirror-480.webp 480w, /images/dumbbells-mirror-634.webp 634w"
                 sizes="(min-width: 960px) 24vw, 46vw" width="634" height="846" loading="lazy" decoding="async" data-i18n-alt="alt.dumbbells" />
            <span class="pill tile-tag" data-i18n="about.tag.weights"></span>
          </li>
          <li class="tile tile--c" data-reveal>
            <img src="/images/cable-station-800.webp" srcset="/images/cable-station-480.webp 480w, /images/cable-station-800.webp 800w, /images/cable-station-1080.webp 1080w"
                 sizes="(min-width: 960px) 24vw, 46vw" width="1080" height="1920" loading="lazy" decoding="async" data-i18n-alt="alt.cable" />
            <span class="pill tile-tag" data-i18n="about.tag.cable"></span>
          </li>
          <li class="tile tile--d" data-reveal>
            <img src="/images/blue-wide-515.webp" srcset="/images/blue-wide-480.webp 480w, /images/blue-wide-515.webp 515w"
                 sizes="(min-width: 960px) 46vw, 92vw" width="515" height="423" loading="lazy" decoding="async" data-i18n-alt="alt.blueWide" />
            <span class="pill tile-tag" data-i18n="about.tag.mirrors"></span>
          </li>
          <li class="tile tile--e" data-reveal>
            <img src="/images/blue-floor-476.webp" width="476" height="635" loading="lazy" decoding="async" data-i18n-alt="alt.blueFloor" />
            <span class="pill tile-tag" data-i18n="about.tag.blue"></span>
          </li>
        </ul>
      </div>
    </section>

    <!-- 3. FEATURES — tagged: pixels hand off to Memberships -->
    <section id="features" class="sec sec--950" data-st-03="14" data-st-mobile-resolution="8">
      <div class="bg" aria-hidden="true">
        <span class="glow" style="--x:0%;--y:50%;--s:80vmax;--c:rgba(26,59,176,.5)"></span>
        <span class="glow" style="--x:100%;--y:100%;--s:60vmax;--c:rgba(46,93,230,.3)"></span>
        <div class="guides"><i></i><i></i><i></i></div>
      </div>
      <div class="inner">
        <div class="sec-head">
          <div>
            <span class="pill pill--dot" data-reveal data-i18n="feat.label"></span>
            <h2 class="h2" data-reveal data-i18n="feat.h2"></h2>
          </div>
          <p class="sec-p" data-reveal data-i18n="feat.p"></p>
        </div>

        <ul class="feat-grid" role="list">
          <li class="feat glass" data-reveal><span class="feat-ic"><svg class="ic" aria-hidden="true"><use href="#i-dumbbell"/></svg></span><h3 data-i18n="feat.1.t"></h3><p data-i18n="feat.1.p"></p></li>
          <li class="feat glass" data-reveal><span class="feat-ic"><svg class="ic" aria-hidden="true"><use href="#i-machine"/></svg></span><h3 data-i18n="feat.2.t"></h3><p data-i18n="feat.2.p"></p></li>
          <li class="feat glass" data-reveal><span class="feat-ic"><svg class="ic" aria-hidden="true"><use href="#i-cable"/></svg></span><h3 data-i18n="feat.3.t"></h3><p data-i18n="feat.3.p"></p></li>
          <li class="feat glass" data-reveal><span class="feat-ic"><svg class="ic" aria-hidden="true"><use href="#i-cardio"/></svg></span><h3 data-i18n="feat.4.t"></h3><p data-i18n="feat.4.p"></p></li>
          <li class="feat glass" data-reveal><span class="feat-ic"><svg class="ic" aria-hidden="true"><use href="#i-mirror"/></svg></span><h3 data-i18n="feat.5.t"></h3><p data-i18n="feat.5.p"></p></li>
          <li class="feat glass" data-reveal><span class="feat-ic"><svg class="ic" aria-hidden="true"><use href="#i-light"/></svg></span><h3 data-i18n="feat.6.t"></h3><p data-i18n="feat.6.p"></p></li>
        </ul>
      </div>
    </section>

    <!-- 4. MEMBERSHIPS — tagged: pixels hand off to Locations -->
    <section id="plans" class="sec sec--900" data-st-03="20" data-st-mobile-resolution="10">
      <div class="bg" aria-hidden="true">
        <span class="glow" style="--x:50%;--y:62%;--s:110vmax;--c:rgba(26,59,176,.5)"></span>
        <span class="glow" style="--x:96%;--y:100%;--s:60vmax;--c:rgba(46,93,230,.3)"></span>
        <div class="guides"><i></i><i></i><i></i></div>
      </div>
      <div class="inner">
        <div class="sec-head">
          <div>
            <span class="pill pill--dot" data-reveal data-i18n="plans.label"></span>
            <h2 class="h2" data-reveal data-i18n="plans.h2"></h2>
          </div>
          <p class="sec-p" data-reveal data-i18n="plans.p"></p>
        </div>

        <div class="branch-pick" role="group" aria-labelledby="pick-label" data-reveal>
          <span id="pick-label" class="pick-label" data-i18n="plans.pick"></span>
          <div class="seg" data-render="pick"></div>
        </div>

        <div class="plans" id="plans-grid" data-render="plans"></div>
      </div>
    </section>

    <!-- 5. LOCATIONS — tagged: pixels hand off to the final CTA -->
    <section id="locations" class="sec sec--950" data-st-03="14" data-st-mobile-resolution="8">
      <div class="bg" aria-hidden="true">
        <span class="glow" style="--x:0%;--y:60%;--s:80vmax;--c:rgba(26,59,176,.5)"></span>
        <span class="glow" style="--x:100%;--y:100%;--s:60vmax;--c:rgba(46,93,230,.28)"></span>
        <div class="guides"><i></i><i></i><i></i></div>
      </div>
      <div class="inner">
        <div class="sec-head">
          <div>
            <span class="pill pill--dot" data-reveal data-i18n="loc.label"></span>
            <h2 class="h2" data-reveal data-i18n="loc.h2"></h2>
          </div>
          <p class="sec-p" data-reveal data-i18n="loc.p"></p>
        </div>
        <div class="branches" id="branch-grid" data-render="branches"></div>
      </div>
    </section>

    <!-- 6. FINAL CTA + FOOTER -->
    <section id="contact" class="sec sec--900 contact">
      <div class="bg" aria-hidden="true">
        <span class="glow" style="--x:50%;--y:46%;--s:100vmax;--c:rgba(26,59,176,.55)"></span>
        <span class="glow" style="--x:50%;--y:100%;--s:70vmax;--c:rgba(46,93,230,.3)"></span>
        <div class="guides"><i></i><i></i><i></i></div>
      </div>
      <div class="inner contact-inner">
        <span class="pill pill--dot" data-reveal data-i18n="cta.label"></span>
        <h2 class="h2 h2--xl" data-reveal data-i18n="cta.h2"></h2>
        <div class="cta-buttons" data-reveal data-render="cta"></div>
      </div>

      <footer class="footer">
        <div class="inner footer-grid">
          <div class="f-brand">
            <a class="wordmark" href="#home" aria-label="Fort Fitness"><span class="w-fort">FORT</span><span class="w-fitness">FITNESS</span></a>
            <button type="button" class="lang-btn" data-lang-toggle data-i18n-aria="nav.langAria"><span data-i18n="nav.lang"></span></button>
          </div>
          <nav class="f-col" data-i18n-aria="footer.explore">
            <h3 data-i18n="footer.explore"></h3>
            <ul role="list">
              <li><a href="#about" data-i18n="nav.about"></a></li>
              <li><a href="#plans" data-i18n="nav.plans"></a></li>
              <li><a href="#locations" data-i18n="nav.locations"></a></li>
            </ul>
          </nav>
          <div class="f-col">
            <h3 data-i18n="footer.contact"></h3>
            <ul role="list" data-render="footcontact"></ul>
          </div>
          <p class="copy" data-i18n="footer.copy"></p>
        </div>
      </footer>
    </section>
  </main>

  <!-- Mobile-only sticky call bar -->
  <nav class="callbar" data-i18n-aria="call.bar" data-render="callbar"></nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
